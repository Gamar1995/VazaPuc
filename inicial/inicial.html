<!DOCTYPE html>
<html lang="pt-br">

<head>
    <title>Login</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Ícones e fontes -->
    <link rel="stylesheet" href="fonts/font-awesome-4.7.0/css/font-awesome.min.css" />
    <link rel="stylesheet" href="fonts/iconic/css/material-design-iconic-font.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="icon" type="image/png" sizes="32x32" href="../images/favicon_io/favicon-32x32.png">

    <!-- CSS -->
    <link rel="stylesheet" href="login.css" />
</head>

<body>

    <div class="limiter">
        <div class="container-login100" style="background-image: url('images/bg-01.jpg');">
            <div class="wrap-login100">
                <form class="login100-form" id="loginForm">
                    <span class="login100-form-title">
                        Login
                    </span>

                    <!-- Email -->
                    <div class="wrap-input100">
                        <span class="label-input100"><strong>E-mail</strong></span>
                        <input class="input100" type="email" name="email" placeholder="Digite seu email" required />
                        <span class="focus-input100" data-symbol="&#xf15a;"></span>
                    </div>

                    <!-- Senha -->
                    <div class="wrap-input100">
                        <span class="label-input100"><strong>Senha</strong></span>
                        <input class="input100" type="password" name="password" placeholder="Digite sua senha" required />
                        <span class="focus-input100" data-symbol="&#xf190;"></span>
                    </div>

                    <!-- Lembrar senha -->
                    <div class="flex-sb-m w-full p-t-3 p-b-32">
                        <div>
                            <input type="checkbox" name="remember" id="remember">
                            <label for="remember">Lembrar-me</label>
                        </div>

                        <div>
                            <a href="#" class="txt2">Esqueceu a senha?</a>
                        </div>
                    </div>

                    <!-- Botão -->
                    <div class="container-login100-form-btn">
                        <div class="wrap-login100-form-btn">
                            <div class="login100-form-bgbtn"></div>
                            <button type="button" id="btnLogin">Entrar</button>
                        </div>
                    </div>

                    <!-- Redes sociais -->
                    <div class="flex-c-m">
                        <a href="#" class="login100-social-item bg1">
                            <i class="bi bi-facebook"></i>
                        </a>
                        <a href="#" class="login100-social-item bg2">
                            <i class="bi bi-twitter"></i>
                        </a>
                        <a href="#" class="login100-social-item bg3">
                            <i class="bi bi-google"></i>
                        </a>
                    </div>

                    <!-- Criar conta -->
                    <div class="flex-col-c">
                        <span class="txt1">Não tem conta?</span>
                        <a href="cadastro.html" class="txt2">Criar conta</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Script -->
    <script>
        document.getElementById("btnLogin").addEventListener("click", function () {
            const form = document.getElementById("loginForm");

            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            const email = form.email.value;
            const senha = form.password.value;

            // Simulação de login (substituir por backend depois)
            if (email === "admin@email.com" && senha === "1234") {
                alert("Login realizado com sucesso!");
                window.location.href = "dashboard.html";
            } else {
                alert("E-mail ou senha inválidos.");
            }
        });
    </script>

</body>

</html>
