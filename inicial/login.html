<style>
:root {
  --primary: #a31f4b;
  --primary-rgb: 163, 31, 75; /* Adicionado para permitir brilhos e transparências */
  --primary-dark: #7a1738;
  --bg: #0f0509;
  --bg-input: #261018;
  --border: #3d1426;
  --text: #fceef2;
  --text-muted: #9e7885;
}

/* ===== TEMAS ESCUROS ===== */
[data-theme="azul"] {
  --primary: #1f5aa3; --primary-rgb: 31, 90, 163; --primary-dark: #143e75;
  --bg: #070a16; --bg-input: #0d1326; --border: #1a274a;
}
[data-theme="cinza"] {
  --primary: #888888; --primary-rgb: 136, 136, 136; --primary-dark: #555555;
  --bg: #0a0a0a; --bg-input: #141414; --border: #2a2a2a;
}
[data-theme="amarelo"] {
  --primary: #b8860b; --primary-rgb: 184, 134, 11; --primary-dark: #8b6508;
  --bg: #121008; --bg-input: #1f1c0d; --border: #3d3618;
}

/* ===== TEMAS CLAROS ===== */
[data-theme="padrao-claro"] {
  --primary: #a31f4b; --primary-rgb: 163, 31, 75; --primary-dark: #7a1738;
  --bg: #f4f6f8; --bg-input: #ffffff; --border: #dce0e4;
  --text: #1a1a1a; --text-muted: #5c6c7c;
}
[data-theme="azul-claro"] {
  --primary: #1f5aa3; --primary-rgb: 31, 90, 163; --primary-dark: #143e75;
  --bg: #f0f4f8; --bg-input: #ffffff; --border: #d7e2ea;
  --text: #0f1c2b; --text-muted: #5a6e82;
}
[data-theme="cinza-claro"] {
  --primary: #555555; --primary-rgb: 85, 85, 85; --primary-dark: #333333;
  --bg: #f5f5f5; --bg-input: #ffffff; --border: #e0e0e0;
  --text: #111111; --text-muted: #666666;
}
[data-theme="amarelo-claro"] {
  --primary: #b8860b; --primary-rgb: 184, 134, 11; --primary-dark: #8b6508;
  --bg: #fcfbf7; --bg-input: #ffffff; --border: #e8e4d3;
  --text: #1f1c0d; --text-muted: #7a7051;
}

body {
  margin:0;
  font-family:'DM Sans',sans-serif;
  background:var(--bg);
  color:var(--text);
  display:flex;
}

/* ===== ESQUERDA (IGUAL CADASTRO) ===== */
.visual {
  width: 45%;
  height: 100vh;
  position: fixed;
  /* Agora usa variáveis dinâmicas em vez de cores fixas */
  background: radial-gradient(circle at top, rgba(var(--primary-rgb), 0.2), transparent),
              linear-gradient(160deg, var(--bg-input), var(--bg));
  padding: 48px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.visual h1 {
  font-family:'DM Serif Display';
  font-size:48px;
}

.visual p {
  color:var(--text-muted);
  max-width:300px;
  margin-top:10px;
}

/* ===== DIREITA ===== */
.form-side {
  margin-left:45%;
  width:55%;
  display:flex;
  align-items:center;
  justify-content:center;
}

.card {
  width:100%;
  max-width:420px;
}

h2 {
  font-family:'DM Serif Display';
  font-size:32px;
}

.subtitle {
  color:var(--text-muted);
  margin-bottom:30px;
}

.subtitle a {
  color:#e8547a;
  text-decoration:none;
}

/* INPUT */
.input-group {
  margin-bottom:16px;
}

input {
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid var(--border);
  background:var(--bg-input);
  color:var(--text);
}

input:focus {
  outline:none;
  border-color:var(--primary);
}

/* BOTÃO */
button {
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:white;
  font-weight:700;
  cursor:pointer;
  margin-top:10px;
}

button:hover {
  transform:translateY(-2px);
}

/* MSG */
.msg {
  margin-bottom:15px;
  font-size:14px;
}

.error { color:#e74c3c; }
.success { color:#2ecc71; }

@media(max-width:900px){
  .visual{display:none;}
  .form-side{margin:0;width:100%;}
}
</style>
</head>
<body>

<div class="visual">
  <h1>Vaza PUC</h1>
  <p>A rede social da sua faculdade. Veja o que tá rolando no campus em tempo real.</p>
</div>

<div class="form-side">
  <div class="card">
    <h2>Entrar</h2>
    <p class="subtitle">Não tem conta? <a href="cadastro.html">Criar conta →</a></p>

    <div id="msg" class="msg"></div>

    <form id="loginForm">
      <div class="input-group">
        <input type="email" id="email" placeholder="E-mail" required>
      </div>

      <div class="input-group">
        <input type="password" id="password" placeholder="Senha" required>
      </div>

      <button id="btnLogin">Entrar</button>
      <a href="#" id="forgotPassword">Esqueci minha senha</a>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = 'https://ocaizkdbdpmijljgxorh.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9jYWl6a2RiZHBtaWpsamd4b3JoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4MjM0NTIsImV4cCI6MjA5MDM5OTQ1Mn0.TD7qI0xoLfUrnFvBvmJByJbE3TNJ4W6JHlC1tSRymvU';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Se já estiver logado → redireciona

sb.auth.getUser().then(res => {
  if (res.data.user) {
    window.location.href = '../PaginaPrincipal/vazadinhos.html';
  }
});
document.getElementById('forgotPassword').addEventListener('click', async () => {
  const email = document.getElementById('email').value;
  const btn = document.getElementById('forgotPassword'); // usamos o link como botão

  if (!email) {
    alert('Digite seu e-mail primeiro.');
    return;
  }

  // Desativa e muda o texto
  btn.style.pointerEvents = 'none';
  const originalText = btn.textContent;
  btn.textContent = 'Enviando...';

  try {
    const { error } = await sb.auth.resetPasswordForEmail(email, {
  // Troque a URL do GitHub pela do seu Localhost temporariamente
  redirectTo: 'http://127.0.0.1:5500/VazaPuc/reset.html' 
});

    if (error) throw error;

    alert('Email de redefinição enviado!');
  } catch (error) {
    console.error(error);
    alert('Erro ao enviar email: ' + error.message);
  } finally {
    // Reativa o link
    btn.style.pointerEvents = 'auto';
    btn.textContent = originalText;
  }
});
// ======================================================
// LOGIN
// ======================================================
loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();

  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const btn = document.getElementById('btnLogin');

  btn.disabled = true;
  btn.textContent = 'Entrando...';

  try {
    const { error } = await sb.auth.signInWithPassword({
      email,
      password
    });

    if (error) throw error;

    showMessage('Login realizado!', 'success');
    
    // Aguarda um pouco para garantir que o session está salvo
    setTimeout(() => {
      window.location.href = '../PaginaPrincipal/vazadinhos.html';
    }, 500);

  } catch(error) {
    console.error('Erro no login:', error);
    showMessage(translateError(error.message), 'error');
    btn.disabled = false;
    btn.textContent = 'Entrar';
  }
});

// ======================================================
// UTIL
// ======================================================
function showMessage(msg, type) {
  const el = document.getElementById('msg');
  el.textContent = msg;
  el.className = `msg ${type}`;
}

function translateError(msg) {
  if (msg.includes('Invalid login credentials')) return 'E-mail ou senha incorretos.';
  if (msg.includes('Email not confirmed')) return 'Confirme seu e-mail antes de fazer login.';
  if (msg.includes('Email already registered')) return 'E-mail já cadastrado.';
  if (msg.includes('Password')) return 'Senha inválida.';
  return msg;
}
</script>

</body>
</html>
